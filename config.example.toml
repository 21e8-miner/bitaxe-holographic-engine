# Holographic Mining Engine — example config
# Copy to config.toml or set HME_CONFIG=/path/to/file
# Env vars override: HME_BITAXE_IP, HME_DRY_RUN=1, etc.

[device]
# AxeOS host (no scheme). Comma-separated list for multi-device later.
ip = "192.168.0.23"
# Optional: force chip family for J/TH reference if auto-detect fails
# chip = "BM1370"
timeout_sec = 8.0
# Prefer not restarting; only restart if AxeOS requires it for V/F apply
allow_restart = false

[bounds]
# Safe V/F envelope — adjust per board/cooling
min_freq_mhz = 425
max_freq_mhz = 700
base_freq_mhz = 500
min_voltage_mv = 1050
max_voltage_mv = 1250
# Absolute abort conditions (hardware safety — not electricity cost)
max_temp_c = 75.0
max_vr_temp_c = 86.0
max_power_w = 40.0
min_vin_mv = 4800.0
max_reject_pct = 2.0
# Soft warn (scoring penalties)
warn_temp_c = 70.0
warn_vr_temp_c = 80.0

[tuner]
# true = log proposals, never PATCH device
dry_run = true
# max_hashrate = free power (default) | efficiency = paid power / J/TH
objective = "max_hashrate"
# Minimum seconds between applied changes
min_change_interval_sec = 300
# Seconds to soak after an applied change before score
dwell_sec = 120
poll_sec = 5.0
zero_hash_abort_sec = 45
good_samples = 3
# free-power: require this HR gain to accept a step
min_hashrate_gain = 0.02
max_hashrate_drop = 0.12
# paid-power only: reject if J/TH worsens by more than this
max_jth_regression = 0.08
freq_step_mhz = 25
voltage_steps_mv = []
mode = "climb"
max_steps = 8

[qc]
hashrate_unit = "auto"   # auto | ghs | ths
free_power = true
ref_j_per_th = { BM1366 = 17.0, BM1368 = 16.5, BM1370 = 15.5, default = 17.0 }

[pool]
probe_enabled = true
tcp_timeout_sec = 2.5
warn_fallback_when_primary_up = true

[logging]
dir = "logs"
jsonl_name = "hme_telemetry.jsonl"
events_name = "hme_events.jsonl"
# Keep in-memory history for doctor/status
history_len = 500

[server]
host = "127.0.0.1"
port = 5033
