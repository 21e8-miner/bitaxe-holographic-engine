<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HME · Bitaxe desk</title>
  <style>
    :root {
      --bg:#07090d; --panel:#0c1118; --line:#1a222e; --t:#e8eef6; --m:#7a8a9e;
      --g:#3dd68c; --r:#ff6b6b; --c:#2dd4bf; --a:#f0b429; --blue:#3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh;
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #122033 0%, var(--bg) 55%);
      color: var(--t);
    }
    header {
      display:flex; flex-wrap:wrap; gap:12px; align-items:center;
      padding:14px 18px; border-bottom:1px solid var(--line);
      background: linear-gradient(180deg, #0b1016, #07090d);
    }
    h1 { margin:0; font-size:1.15rem; font-weight:750; letter-spacing:-.02em; }
    h1 em { font-style:normal; color:var(--c); font-weight:500; margin-left:8px; font-size:.78rem; }
    .dot { width:9px; height:9px; border-radius:50%; background:#334155; display:inline-block; margin-right:8px; }
    .dot.on { background:var(--g); box-shadow:0 0 0 4px rgba(61,214,140,.15); }
    .dot.err { background:var(--r); box-shadow:0 0 0 4px rgba(255,107,107,.15); }
    .pill {
      border:1px solid var(--line); background:var(--panel); color:var(--m);
      border-radius:999px; padding:6px 12px; font-size:.78rem;
    }
    .pill b { color:var(--t); }
    .pill.ok { border-color:rgba(61,214,140,.35); color:var(--g); }
    .pill.warn { border-color:rgba(240,180,41,.4); color:var(--a); }
    .pill.bad { border-color:rgba(255,107,107,.4); color:var(--r); }
    main { padding:18px; max-width:1200px; margin:0 auto; }
    .grid {
      display:grid; gap:12px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      margin-bottom:16px;
    }
    .card {
      background:var(--panel); border:1px solid var(--line); border-radius:12px;
      padding:14px 16px;
    }
    .card .k { color:var(--m); font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; }
    .card .v {
      margin-top:6px; font-size:1.45rem; font-weight:750;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing:-.02em;
    }
    .card .s { margin-top:4px; color:var(--m); font-size:.78rem; }
    .row { display:grid; gap:12px; grid-template-columns: 1.4fr 1fr; }
    @media (max-width: 860px) { .row { grid-template-columns:1fr; } }
    h2 { margin:0 0 10px; font-size:.85rem; color:var(--c); font-weight:650; }
    table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #121820; }
    th { color:var(--m); font-size:.68rem; text-transform:uppercase; font-weight:600; }
    td { font-family: ui-monospace, Menlo, monospace; font-size:.82rem; }
    #chart {
      width:100%; height:220px; display:block;
      background:rgba(15,23,42,.35); border-radius:10px; border:1px solid rgba(51,65,85,.35);
    }
    .errbox {
      display:none; margin:12px 18px; padding:12px 14px; border-radius:10px;
      background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.35); color:#fecaca;
    }
    footer {
      padding:10px 18px 24px; color:var(--m); font-size:.75rem; text-align:center;
    }
    a { color:var(--c); }
  </style>
</head>
<body>
  <header>
    <h1><span class="dot" id="dot"></span>HME desk <em>Bitaxe · safe monitor</em></h1>
    <span class="pill" id="chipPill">chip —</span>
    <span class="pill" id="gatePill">gates —</span>
    <span class="pill" id="poolPill">pool —</span>
    <span class="pill" id="agePill">age —</span>
  </header>
  <div class="errbox" id="err"></div>
  <main>
    <div class="grid">
      <div class="card"><div class="k">Hashrate</div><div class="v" id="hr">—</div><div class="s" id="hrSub">GH/s</div></div>
      <div class="card"><div class="k">Efficiency</div><div class="v" id="jth">—</div><div class="s">J/TH</div></div>
      <div class="card"><div class="k">Power</div><div class="v" id="pwr">—</div><div class="s">watts</div></div>
      <div class="card"><div class="k">Temp</div><div class="v" id="tmp">—</div><div class="s" id="tmpSub">ASIC</div></div>
      <div class="card"><div class="k">Frequency</div><div class="v" id="frq">—</div><div class="s" id="frqSub">MHz</div></div>
      <div class="card"><div class="k">Reject</div><div class="v" id="rej">—</div><div class="s" id="rejSub">shares</div></div>
    </div>

    <div class="row">
      <div class="card">
        <h2>Hashrate · last ~5 min</h2>
        <canvas id="chart" width="800" height="220"></canvas>
      </div>
      <div class="card">
        <h2>Device</h2>
        <table>
          <tbody id="devRows">
            <tr><td colspan="2" style="color:var(--m)">Connecting…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <footer>
    Live via <code>/api/status</code> · refresh 3s ·
    <a href="/api/status" target="_blank">JSON</a> ·
    <a href="/api/qc" target="_blank">QC</a> ·
    <a href="/api/raw" target="_blank">raw AxeOS</a>
    · research monitor only
  </footer>

<script>
const $ = id => document.getElementById(id);
const hist = []; // {t, ghs, temp, jth}
const MAX = 100;

function n(x, d=1) {
  if (x == null || Number.isNaN(+x)) return "—";
  return Number(x).toFixed(d);
}

function setErr(msg) {
  const el = $("err");
  if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
  el.style.display = "block";
  el.textContent = msg;
}

function draw() {
  const c = $("chart");
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth || 800, H = 220;
  c.width = W * dpr; c.height = H * dpr;
  c.style.width = W + "px"; c.style.height = H + "px";
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (hist.length < 2) {
    ctx.fillStyle = "#64748b";
    ctx.font = "12px system-ui";
    ctx.fillText("Collecting samples…", 16, H/2);
    return;
  }
  const pad = { l: 48, r: 12, t: 14, b: 24 };
  const vals = hist.map(h => h.ghs);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { lo -= 5; hi += 5; }
  const span = hi - lo || 1;
  const xOf = i => pad.l + (i / (hist.length - 1)) * (W - pad.l - pad.r);
  const yOf = v => pad.t + (1 - (v - lo) / span) * (H - pad.t - pad.b);

  ctx.strokeStyle = "rgba(51,65,85,.45)";
  ctx.lineWidth = 1;
  for (let g = 0; g < 4; g++) {
    const y = pad.t + (g / 3) * (H - pad.t - pad.b);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    const pv = hi - (g / 3) * span;
    ctx.fillStyle = "#64748b"; ctx.font = "10px ui-monospace,monospace"; ctx.textAlign = "right";
    ctx.fillText(pv.toFixed(0), pad.l - 6, y + 3);
  }

  ctx.beginPath();
  hist.forEach((h, i) => {
    const x = xOf(i), y = yOf(h.ghs);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = "#2dd4bf";
  ctx.lineWidth = 2;
  ctx.stroke();

  // temp overlay scaled
  const temps = hist.map(h => h.temp);
  const tLo = Math.min(...temps), tHi = Math.max(...temps);
  const tSpan = (tHi - tLo) || 1;
  ctx.beginPath();
  hist.forEach((h, i) => {
    const y = pad.t + (1 - (h.temp - tLo) / tSpan) * (H - pad.t - pad.b);
    if (i === 0) ctx.moveTo(xOf(i), y); else ctx.lineTo(xOf(i), y);
  });
  ctx.strokeStyle = "rgba(240,180,41,.55)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = "#64748b";
  ctx.font = "10px system-ui";
  ctx.textAlign = "left";
  ctx.fillText("teal = GH/s · gold = temp", pad.l, H - 8);
}

async function tick() {
  try {
    const res = await fetch("/api/status", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    setErr("");
    const m = d.metrics || {};
    $("dot").className = "dot on";
    $("chipPill").innerHTML = `<b>${d.chip || "—"}</b> · ${d.version || ""}`;
    $("gatePill").className = "pill " + (d.gates_ok ? "ok" : "bad");
    $("gatePill").textContent = d.gates_ok ? "gates OK" : "GATE FAIL";
    const fb = d.stratum?.using_fallback;
    $("poolPill").className = "pill " + (fb ? "warn" : "ok");
    $("poolPill").textContent = (fb ? "fallback " : "") + (fb ? (d.stratum?.fallback || "pool") : (d.stratum?.url || "pool"));
    $("agePill").textContent = new Date().toLocaleTimeString();

    $("hr").textContent = n(m.hashrate_ghs, 1);
    $("hrSub").textContent = `${n(m.hashrate_ths, 3)} TH/s`;
    $("jth").textContent = n(m.j_per_th, 2);
    $("pwr").textContent = n(m.power_w, 2);
    $("tmp").textContent = n(m.temp_c, 1) + "°";
    $("tmpSub").textContent = m.vr_temp_c != null ? `VR ${n(m.vr_temp_c, 0)}°C` : "ASIC";
    $("frq").textContent = n(m.frequency_mhz, 0);
    $("frqSub").textContent = m.voltage_mv != null ? `${n(m.voltage_mv, 0)} mV` : "MHz";
    $("rej").textContent = n(m.reject_pct, 3) + "%";
    $("rejSub").textContent = `${m.shares_accepted ?? "—"} ok / ${m.shares_rejected ?? "—"} rej`;

    const rows = [
      ["IP", d.ip || "—"],
      ["Hostname", d.hostname || "—"],
      ["Fan", m.fan_rpm != null ? m.fan_rpm + " rpm" : "—"],
      ["Core V actual", m.voltage_mv != null ? m.voltage_mv + " mV" : "—"],
      ["Primary pool", d.stratum?.url || "—"],
      ["Fallback pool", d.stratum?.fallback || "—"],
      ["Active", d.stratum?.using_fallback ? "fallback" : "primary"],
      ["Unit sniff", m.hashrate_unit || "—"],
    ];
    $("devRows").innerHTML = rows.map(([k,v]) =>
      `<tr><th style="width:40%">${k}</th><td>${v}</td></tr>`
    ).join("");

    hist.push({ t: Date.now(), ghs: +m.hashrate_ghs || 0, temp: +m.temp_c || 0, jth: +m.j_per_th || 0 });
    if (hist.length > MAX) hist.shift();
    draw();
  } catch (e) {
    $("dot").className = "dot err";
    setErr("Frontend cannot reach HME API: " + e.message + " — is `python -m hme serve` running?");
  }
}

window.addEventListener("resize", draw);
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
